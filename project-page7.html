<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaraa Electro - Component Shooter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08031a;font-family:system-ui,Arial,sans-serif;color:#fff;overflow:hidden;height:100vh}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 70%,#3a1060,#08031a 70%);z-index:5;text-align:center;padding:20px}
#intro h1{font-size:clamp(28px,5vw,52px);margin-bottom:12px;color:#fff}
#intro p{color:#cfd8ff;margin-bottom:28px;max-width:520px}
.btn{border:none;border-radius:10px;padding:14px 34px;font-size:20px;font-weight:700;cursor:pointer;color:#fff}
#startBtn{background:#2ecc71}
#game{display:none;position:fixed;inset:0}
#bar{position:absolute;top:0;left:0;right:0;height:46px;background:#87ceeb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:3;font-weight:700}
#bar .logo{font-size:18px}
#qhead{position:absolute;top:56px;left:0;right:0;text-align:center;color:#ff5252;font-weight:700;font-size:18px;z-index:3}
#qbox{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:min(680px,90%);background:#fff;color:#0b1030;padding:12px 16px;border-radius:8px;text-align:center;font-weight:600;font-size:clamp(14px,2vw,19px);z-index:3}
#cv{position:absolute;inset:0;width:100%;height:100%}
#back{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:#1b2a6b;border:2px solid #4fc3ff;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;text-decoration:none;z-index:4}
#back:hover{background:#2b3f9c}
#overlay{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:none;flex-direction:column;align-items:center;gap:10px;z-index:4;text-align:center}
#overlay .msg{font-size:26px;font-weight:700}
#retryBtn{background:#e53935;display:none}
#nextBtn{background:#2ecc71;display:none}
</style>
</head>
<body>
<div id="intro">
<h1>Component Shooter</h1>
<p>Read the question, then shoot the spaceship with the correct component. A wrong shot and the enemy fleet attacks!</p>
<button class="btn" id="startBtn">Start play</button>
</div>

<div id="game">
<div id="bar"><span class="logo">Aaraa Electro</span><span id="stats">Level 1 &nbsp; Score 0</span></div>
<div id="qhead">Question 1</div>
<div id="qbox">Loading...</div>
<canvas id="cv"></canvas>
<a id="back" href="page6.html" aria-label="Back to page 6">&#8592;</a>
<div id="overlay">
<div class="msg" id="msg"></div>
<button class="btn" id="retryBtn">Retry</button>
<button class="btn" id="nextBtn">Next</button>
</div>
</div>

<script>
var BANK=[
["Which component makes light when power is given?","LED",["Buzzer","Battery","Wire","Capacitor","Resistor","Switch"]],
["Which component makes a beep sound?","Buzzer",["LED","Battery","Resistor","Switch","Wire","Motor"]],
["Which component gives power to a circuit?","Battery",["LED","Buzzer","Resistor","Capacitor","Diode","Switch"]],
["Which component stores a small amount of electric charge?","Capacitor",["Resistor","LED","Wire","Battery","Diode","Buzzer"]],
["Which component limits the flow of current?","Resistor",["LED","Capacitor","Battery","Wire","Switch","Buzzer"]],
["Which component turns a circuit on and off?","Switch",["LED","Resistor","Capacitor","Battery","Diode","Buzzer"]],
["Which component lets current flow in only one direction?","Diode",["Resistor","LED","Capacitor","Wire","Switch","Battery"]],
["Which component spins when power is given?","Motor",["LED","Buzzer","Resistor","Capacitor","Battery","Switch"]],
["Which component carries current from one point to another?","Wire",["Resistor","LED","Capacitor","Battery","Diode","Switch"]],
["Which component is the small brain of an Arduino project?","Microcontroller",["Resistor","LED","Wire","Battery","Buzzer","Switch"]],
["Which component senses how bright the light is?","LDR",["Resistor","LED","Buzzer","Capacitor","Diode","Switch"]],
["Which component measures distance using sound waves?","Ultrasonic sensor",["LED","Buzzer","Resistor","Motor","Capacitor","Switch"]],
["Which component changes its resistance when you turn a knob?","Potentiometer",["Resistor","LED","Capacitor","Diode","Switch","Buzzer"]],
["Which component amplifies or switches electronic signals?","Transistor",["Resistor","LED","Capacitor","Diode","Switch","Buzzer"]],
["Which component moves to an exact angle you command?","Servo motor",["Buzzer","LED","Resistor","Battery","Capacitor","Switch"]]
];

var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=0,H=0;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

var PALS=[{a:'#35d0ee',b:'#0a6a92',p:'#f08a24',q:'#a85a10'},{a:'#f59b3a',b:'#9a4310',p:'#35d0ee',q:'#0a6a92'}];
var stars=[],streaks=[],i;
for(i=0;i<110;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,s:Math.random()*.03+.01,a:Math.random()*.6+.4});
for(i=0;i<7;i++)streaks.push({x:Math.random(),y:Math.random(),l:40+Math.random()*50,s:.08+Math.random()*.06});

var state='idle',qNo=0,score=0,level=1,order=[],cur=null,ships=[],bullets=[],rockets=[],puffs=[],sparks=[];
var hero={x:0,y:0,alive:true,exploded:false},shootTarget=null,fireCool=0,speedMul=1;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function newOrder(){order=shuffle(BANK.map(function(_,i){return i}))}
newOrder();

function setupQuestion(){
 var idx=order.pop();if(!order.length)newOrder();
 cur=BANK[idx];
 var wrong=shuffle(cur[2].slice()).slice(0,4);
 var names=shuffle([cur[1]].concat(wrong));
 ships=[];
 var n=names.length,gap=W/(n+1);
 for(var k=0;k<n;k++){
  ships.push({name:names[k],correct:names[k]===cur[1],x:gap*(k+1),y:-80-Math.random()*40,baseX:gap*(k+1),k:k%2,phase:Math.random()*6,alive:true,dead:false});
 }
 qNo++;
 level=1+Math.floor((qNo-1)/5);
 speedMul=1+(level-1)*0.35;
 document.getElementById('qhead').textContent='Question '+qNo;
 document.getElementById('qbox').textContent=cur[0];
 document.getElementById('stats').innerHTML='Level '+level+' &nbsp; Score '+score;
 bullets=[];rockets=[];puffs=[];sparks=[];
 hero.x=W/2;hero.y=H-90;hero.alive=true;hero.exploded=false;
 shootTarget=null;
 document.getElementById('overlay').style.display='none';
 document.getElementById('retryBtn').style.display='none';
 document.getElementById('nextBtn').style.display='none';
 state='playing';
}

function startGame(){
 document.getElementById('intro').style.display='none';
 document.getElementById('game').style.display='block';
 qNo=0;score=0;newOrder();setupQuestion();
}

function roundRect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}

function drawShip(s,t){
 if(s.dead)return;
 var pal=PALS[s.k],px=s.x,py=s.y;
 ctx.fillStyle=pal.p;ctx.strokeStyle=pal.q;ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(px-12,py+4);ctx.lineTo(px-28,py+8);ctx.lineTo(px-26,py+30);ctx.lineTo(px-10,py+26);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(px+12,py+4);ctx.lineTo(px+28,py+8);ctx.lineTo(px+26,py+30);ctx.lineTo(px+10,py+26);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle=pal.a;
 ctx.beginPath();ctx.moveTo(px-10,py);ctx.lineTo(px-8,py-9);ctx.lineTo(px-5,py);ctx.fill();
 ctx.beginPath();ctx.moveTo(px+10,py);ctx.lineTo(px+8,py-9);ctx.lineTo(px+5,py);ctx.fill();
 var g=ctx.createLinearGradient(px-14,py,px+14,py);g.addColorStop(0,pal.b);g.addColorStop(.5,pal.a);g.addColorStop(1,pal.b);
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(px-14,py);ctx.lineTo(px+14,py);ctx.quadraticCurveTo(px+14,py+26,px,py+46);ctx.quadraticCurveTo(px-14,py+26,px-14,py);ctx.fill();
 ctx.strokeStyle=pal.b;ctx.lineWidth=1.5;
 for(var k=1;k<4;k++){ctx.beginPath();ctx.moveTo(px-12+k*1.5,py+k*8+4);ctx.quadraticCurveTo(px,py+k*8+10,px+12-k*1.5,py+k*8+4);ctx.stroke()}
 ctx.fillStyle='#d9fbff';ctx.beginPath();ctx.ellipse(px,py+10,5,7,0,0,6.283);ctx.fill();
 var fr=2.5+Math.sin(t*20+s.phase)*.7;
 ctx.fillStyle='#ffd27a';
 ctx.beginPath();ctx.arc(px-6,py-3,fr,0,6.283);ctx.fill();
 ctx.beginPath();ctx.arc(px+6,py-3,fr,0,6.283);ctx.fill();
 var label=s.name,tw;
 ctx.font='600 12px system-ui,sans-serif';
 tw=Math.max(60,ctx.measureText(label).width+16);
 roundRect(px-tw/2,py+54,tw,22,4);ctx.fillStyle='rgba(16,10,50,0.9)';ctx.fill();ctx.strokeStyle=pal.a;ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(label,px,py+69);
}

function drawHero(t){
 if(hero.exploded)return;
 var hx=hero.x,hy=hero.y;
 var g=ctx.createRadialGradient(hx,hy,10,hx,hy,50);
 g.addColorStop(0,'rgba(60,140,255,0.05)');g.addColorStop(.8,'rgba(60,140,255,0.35)');g.addColorStop(1,'rgba(60,140,255,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,50,0,6.283);ctx.fill();
 ctx.lineWidth=3;ctx.lineCap='round';
 ctx.strokeStyle='#4fc3ff';ctx.beginPath();ctx.arc(hx,hy,41,t*2,t*2+3.6);ctx.stroke();
 ctx.strokeStyle='#8a6bff';ctx.beginPath();ctx.arc(hx,hy,34,-t*2.6,-t*2.6+2.8);ctx.stroke();
 var fl=10+Math.random()*9;
 ctx.fillStyle='#ffb347';ctx.beginPath();ctx.moveTo(hx-6,hy+26);ctx.lineTo(hx+6,hy+26);ctx.lineTo(hx,hy+26+fl);ctx.fill();
 ctx.fillStyle='#fff1b8';ctx.beginPath();ctx.moveTo(hx-3,hy+26);ctx.lineTo(hx+3,hy+26);ctx.lineTo(hx,hy+26+fl*.55);ctx.fill();
 ctx.fillStyle='#c8321a';
 ctx.beginPath();ctx.moveTo(hx-8,hy+2);ctx.lineTo(hx-32,hy+22);ctx.lineTo(hx-30,hy+31);ctx.lineTo(hx-8,hy+22);ctx.fill();
 ctx.beginPath();ctx.moveTo(hx+8,hy+2);ctx.lineTo(hx+32,hy+22);ctx.lineTo(hx+30,hy+31);ctx.lineTo(hx+8,hy+22);ctx.fill();
 ctx.fillStyle='#ffd27a';ctx.fillRect(hx-15,hy-8,4,16);ctx.fillRect(hx+11,hy-8,4,16);
 var b2=ctx.createLinearGradient(hx-10,0,hx+10,0);b2.addColorStop(0,'#c8321a');b2.addColorStop(.5,'#ff7a45');b2.addColorStop(1,'#c8321a');
 ctx.fillStyle=b2;ctx.beginPath();ctx.moveTo(hx,hy-24);ctx.lineTo(hx+9,hy-2);ctx.lineTo(hx+10,hy+22);ctx.lineTo(hx,hy+28);ctx.lineTo(hx-10,hy+22);ctx.lineTo(hx-9,hy-2);ctx.closePath();ctx.fill();
 ctx.fillStyle='#1b2a6b';ctx.beginPath();ctx.ellipse(hx,hy,4.5,9,0,0,6.283);ctx.fill();
 ctx.fillStyle='#7fe3ff';ctx.beginPath();ctx.ellipse(hx-1,hy-3,1.8,4,0,0,6.283);ctx.fill();
}

function drawBullet(o){
 var g=ctx.createLinearGradient(0,o.y-8,0,o.y+24);
 g.addColorStop(0,'#eaf7ff');g.addColorStop(.4,'#4aa8ff');g.addColorStop(1,'rgba(60,120,255,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(o.x,o.y-8);ctx.quadraticCurveTo(o.x+4,o.y+4,o.x+2,o.y+24);ctx.lineTo(o.x-2,o.y+24);ctx.quadraticCurveTo(o.x-4,o.y+4,o.x,o.y-8);ctx.fill();
}

function drawRocket(r){
 ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.ang);
 ctx.fillStyle='#ffb347';ctx.beginPath();ctx.moveTo(-3,-8);ctx.lineTo(3,-8);ctx.lineTo(0,-8-8-Math.random()*6);ctx.fill();
 ctx.fillStyle='#e8e8f0';ctx.fillRect(-3,-8,6,14);
 ctx.fillStyle='#e53935';ctx.beginPath();ctx.moveTo(-3,6);ctx.lineTo(3,6);ctx.lineTo(0,13);ctx.fill();
 ctx.restore();
}

function addSmoke(x,y,n,big){
 for(var i=0;i<n;i++)puffs.push({x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*20,r:(big?10:5)+Math.random()*8,vx:(Math.random()-.5)*40,vy:-20-Math.random()*40,a:.8,g:(60+Math.random()*50)|0});
}
function addSparks(x,y,n){
 for(var i=0;i<n;i++){var a=Math.random()*6.283,s=60+Math.random()*180;sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a:1,c:Math.random()<.5?'#ffb347':'#ffe27a'})}
}

function fireRockets(){
 ships.forEach(function(s){
  if(s.dead)return;
  var dx=hero.x-s.x,dy=hero.y-(s.y+46),d=Math.sqrt(dx*dx+dy*dy)||1;
  rockets.push({x:s.x,y:s.y+46,vx:dx/d*320,vy:dy/d*320,ang:Math.atan2(dy,dx)-Math.PI/2});
 });
}

var prevT=performance.now(),T0=prevT;
function frame(now){
 var t=(now-T0)/1000,dt=Math.min((now-prevT)/1000,.05);prevT=now;
 ctx.fillStyle='#08031a';ctx.fillRect(0,0,W,H);
 var bgs=[[.2,.7,'120,30,170',.5,Math.max(W,H)*.45],[.85,.8,'200,30,110',.45,Math.max(W,H)*.5],[.5,.25,'60,30,150',.4,Math.max(W,H)*.4]];
 bgs.forEach(function(c){var gr=ctx.createRadialGradient(c[0]*W,c[1]*H,0,c[0]*W,c[1]*H,c[4]);gr.addColorStop(0,'rgba('+c[2]+','+c[3]+')');gr.addColorStop(1,'rgba('+c[2]+',0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)});
 ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
 streaks.forEach(function(s){s.y+=s.s*dt;if(s.y>1.1)s.y=-.1;ctx.beginPath();ctx.moveTo(s.x*W,s.y*H);ctx.lineTo(s.x*W,s.y*H+s.l);ctx.stroke()});
 stars.forEach(function(s){s.y+=s.s*dt;if(s.y>1)s.y=0;ctx.fillStyle='rgba(255,255,255,'+s.a+')';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()});

 var targetY=Math.min(H*.48,H-300);
 if(state==='playing'){
  ships.forEach(function(s){
   if(s.dead)return;
   s.y+=22*speedMul*dt;
   if(s.y>targetY)s.y=targetY;
   s.x=s.baseX+Math.sin(t*1.1+s.phase)*10;
  });
  fireCool-=dt;
  if(fireCool<=0&&shootTarget){fireCool=.18;bullets.push({x:hero.x,y:hero.y-30})}
  bullets.forEach(function(o){o.y-=520*dt});
  var keep=[];
  bullets.forEach(function(o){
   var hit=false;
   for(var i=0;i<ships.length;i++){
    var s=ships[i];
    if(!s.dead&&Math.abs(o.x-s.x)<30&&o.y<s.y+46&&o.y>s.y-10){
     hit=true;addSparks(o.x,o.y,10);
     if(shootTarget&&s===shootTarget&&!s.hit){
      s.hit=true;
      if(s.correct){
       s.dead=true;addSmoke(s.x,s.y+20,14,true);addSparks(s.x,s.y+20,30);
       score+=10;state='won';
       document.getElementById('stats').innerHTML='Level '+level+' &nbsp; Score '+score;
       document.getElementById('msg').textContent='Correct!';
       document.getElementById('overlay').style.display='flex';
       document.getElementById('nextBtn').style.display='inline-block';
      }else{
       s.dead=true;addSmoke(s.x,s.y+20,10,true);addSparks(s.x,s.y+20,24);
       state='attack';fireRockets();
      }
     }
     break;
    }
   }
   if(!hit&&o.y>-30)keep.push(o);
  });
  bullets=keep;
  if(state==='playing'&&shootTarget&&shootTarget.dead)shootTarget=null;
 }
 if(state==='attack'){
  ships.forEach(function(s){if(!s.dead)s.x=s.baseX+Math.sin(t*1.1+s.phase)*10});
  var rk=[];
  rockets.forEach(function(r){
   r.x+=r.vx*dt;r.y+=r.vy*dt;addSmoke(r.x,r.y,1,false);
   var dx=r.x-hero.x,dy=r.y-hero.y;
   if(dx*dx+dy*dy<30*30){addSparks(r.x,r.y,16);addSmoke(r.x,r.y,4,true)}else rk.push(r);
  });
  if(rockets.length&&!rk.length){
   hero.exploded=true;addSmoke(hero.x,hero.y,40,true);addSparks(hero.x,hero.y,80);
   state='lost';
   document.getElementById('msg').textContent='Game over';
   document.getElementById('overlay').style.display='flex';
   document.getElementById('retryBtn').style.display='inline-block';
  }
  rockets=rk;
 }

 ships.forEach(function(s){drawShip(s,t)});
 bullets.forEach(drawBullet);
 rockets.forEach(drawRocket);
 drawHero(t);

 puffs.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=18*dt;p.a-=.45*dt});
 puffs=puffs.filter(function(p){return p.a>0});
 puffs.forEach(function(p){ctx.fillStyle='rgba('+p.g+','+p.g+','+p.g+','+p.a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()});
 sparks.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=1.6*dt});
 sparks=sparks.filter(function(p){return p.a>0});
 sparks.forEach(function(p){ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(p.a,0);ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,6.283);ctx.fill();ctx.globalAlpha=1});

 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

cv.addEventListener('click',function(e){
 if(state!=='playing')return;
 var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 for(var i=0;i<ships.length;i++){
  var s=ships[i];
  if(!s.dead&&Math.abs(x-s.x)<40&&y>s.y-20&&y<s.y+80){shootTarget=s;hero.x=s.x;return}
 }
});

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('nextBtn').addEventListener('click',setupQuestion);
document.getElementById('retryBtn').addEventListener('click',function(){qNo=qNo-1;setupQuestion()});
</script>
</body>
</html>
