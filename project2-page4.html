<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaraa AI Assistant - Aaraa Electro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #dff1ff 0%, #f4faff 55%, #e3f2fd 100%);
    color: #0b2545;
    position: relative;
    overflow-x: hidden;
  }

  /* New Soft Wave & Pulse Animation */
  .wave-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(28px);
    opacity: 0.35;
    animation: floatOrb 10s ease-in-out infinite alternate;
  }

  .orb-1 {
    width: 240px;
    height: 240px;
    background: #38bdf8;
    top: 8%;
    left: 6%;
  }

  .orb-2 {
    width: 300px;
    height: 300px;
    background: #2563eb;
    bottom: 10%;
    right: 8%;
    animation-delay: -4s;
  }

  .orb-3 {
    width: 180px;
    height: 180px;
    background: #0ea5e9;
    top: 48%;
    left: 52%;
    animation-delay: -7s;
  }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(35px, -25px) scale(1.12); }
  }

  .header-bar {
    position: relative;
    z-index: 2;
    background: linear-gradient(90deg, #0b3fbf, #0099e6);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 14px rgba(11, 63, 191, 0.18);
  }

  .header-bar h2 {
    font-size: 21px;
    letter-spacing: 0.3px;
  }

  .back-link {
    color: #fff;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.2);
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  .back-link:hover {
    background: rgba(255, 255, 255, 0.32);
  }

  .hero-banner {
    position: relative;
    z-index: 2;
    background: linear-gradient(135deg, #0b3fbf, #00b4f0);
    color: #fff;
    text-align: center;
    padding: 34px 20px;
  }

  .hero-banner h1 {
    font-size: clamp(26px, 4vw, 36px);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .bot-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    animation: gentlePulse 2.4s infinite ease-in-out;
  }

  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .hero-banner p {
    margin-top: 8px;
    font-size: 15px;
    color: #e6f7ff;
  }

  .main-wrap {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 28px auto 70px;
    padding: 0 18px;
  }

  .panel {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    border: 1px solid #cce3ff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 28px rgba(11, 63, 191, 0.1);
  }

  .panel-title {
    font-size: 20px;
    color: #0b3fbf;
    margin-bottom: 6px;
  }

  .panel-sub {
    font-size: 14px;
    color: #486581;
    margin-bottom: 18px;
  }

  .prompt-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .input-shell {
    flex: 1;
    min-width: 240px;
    display: flex;
    align-items: center;
    background: #f8fbff;
    border: 2px solid #38bdf8;
    border-radius: 999px;
    padding: 4px 12px 4px 16px;
  }

  .prompt-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 11px 8px;
    font-size: 15px;
    color: #0b2545;
    outline: none;
  }

  .voice-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #93c5fd;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .voice-btn:hover {
    background: #1d4ed8;
    color: #fff;
  }

  .voice-btn.active {
    background: #dc2626;
    border-color: #dc2626;
    color: #fff;
  }

  .send-btn {
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #0b3fbf, #0099e6);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 24px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(11, 63, 191, 0.22);
    transition: transform 0.15s ease;
  }

  .send-btn:hover {
    transform: translateY(-1px);
  }

  .quick-bar {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .quick-tag {
    background: #edf6ff;
    border: 1px solid #bfdbfe;
    color: #0b3fbf;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .quick-tag:hover {
    background: #0b3fbf;
    color: #fff;
  }

  .answer-box {
    margin-top: 22px;
    background: #f0f8ff;
    border-left: 5px solid #0b3fbf;
    border-radius: 12px;
    padding: 18px 20px;
    display: none;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-header {
    font-size: 17px;
    font-weight: 700;
    color: #0b3fbf;
    margin-bottom: 8px;
  }

  .answer-body {
    font-size: 15px;
    line-height: 1.7;
    color: #1e3a5f;
  }

  .left-nav-arrow {
    position: fixed;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #0b5be0;
    color: #fff;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="wave-bg">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>
</div>

<header class="header-bar">
  <h2>Aaraa Electro</h2>
  <a class="back-link" href="project1-page3.html">&larr; Back to Circuit</a>
</header>

<section class="hero-banner">
  <h1><span class="bot-badge">🤖</span> Aaraa AI Assistant</h1>
  <p>Created by ஆரா அமுதன் | எந்தக் கேள்வி கேட்டாலும் தமிழில் தெளிவான பதில்</p>
</section>

<main class="main-wrap">
  <div class="panel">
    <h3 class="panel-title">💬 Aaraa Smart AI Hub</h3>
    <p class="panel-sub">எந்தக் கேள்வியும் கேளுங்கள் — உடனடியாகத் தமிழில் பதில் கிடைக்கும்.</p>

    <div class="prompt-row">
      <div class="input-shell">
        <span>🤖</span>
        <input id="questionField" class="prompt-input" type="text" placeholder="உங்கள் கேள்வியை இங்கே டைப் செய்யவும்..." onkeydown="if(event.key==='Enter') runAaraAI()">
        <button id="speechTrigger" class="voice-btn" type="button" title="பேசி கேள்வி கேட்க">🎤</button>
      </div>
      <button class="send-btn" type="button" onclick="runAaraAI()">Ask AI</button>
    </div>

    <div class="quick-bar">
      <button class="quick-tag" type="button" onclick="askPreset('who are you')">Who are you?</button>
      <button class="quick-tag" type="button" onclick="askPreset('how to make a cake')">How to make a cake</button>
      <button class="quick-tag" type="button" onclick="askPreset('how does current work')">How current works</button>
      <button class="quick-tag" type="button" onclick="askPreset('what is a servo motor')">What is a servo motor</button>
    </div>

    <div id="answerCard" class="answer-box">
      <div id="answerTitle" class="answer-header">🤖 Aaraa AI பதில்</div>
      <div id="answerContent" class="answer-body"></div>
    </div>
  </div>
</main>

<a class="left-nav-arrow" href="project1-page3.html" title="Back to Circuit">&#10094;</a>

<script>
  function askPreset(text) {
    document.getElementById('questionField').value = text;
    runAaraAI();
  }

  function buildAnswerForAnyQuestion(rawText, lowerText) {
    const q = rawText.trim();

    // Identity questions ("who are you", "நீ யார்", etc.)
    if (
      lowerText.includes('who are you') ||
      lowerText.includes('who r u') ||
      lowerText.includes('your name') ||
      lowerText.includes('நீ யார்') ||
      lowerText.includes('உன் பெயர்')
    ) {
      return "நான் <b>Aaraa AI Assistant</b> (ஆரா அமுதன் உருவாக்கிய ஸ்மார்ட் உதவியாளர்). நீங்கள் கேட்கும் எலக்ட்ரானிக்ஸ், சர்க்யூட், ரோபோடிக்ஸ் மற்றும் பொதுவான கேள்விகளுக்குத் தமிழில் உடனடியாகப் பதில் சொல்லத் தயாராக இருக்கிறேன்.";
    }

    // Cake making questions
    if (lowerText.includes('cake') || lowerText.includes('கேக்')) {
      return "<b>கேக் (Cake) எப்படி செய்வது?</b><br><br>" +
             "• <b>தேவையான பொருட்கள்:</b> மைதா அல்லது கோதுமை மாவு, சர்க்கரை, வெண்ணெய் அல்லது எண்ணெய், பால்/முட்டை, பேக்கிங் பவுடர் மற்றும் வெண்ணிலா எசன்ஸ்.<br>" +
             "• <b>கலவை:</b> சர்க்கரை மற்றும் வெண்ணெய்/எண்ணெயை நன்கு அடித்துக் கலக்கவும். அதனுடன் பால்/முட்டை மற்றும் எசன்ஸ் சேர்த்து, சலித்த மாவு + பேக்கிங் பவுடரைக் கட்டியில்லாமல் மெதுவாகக் கலக்கவும்.<br>" +
             "• <b>வேகவைத்தல்:</b> நெய் தடவிய பாத்திரத்தில் மாவை ஊற்றி, ஓவனில் (180°C-ல் சுமார் 25–35 நிமிடம்) அல்லது குக்கரில்/கடாயில் மிதமான தீயில் வெந்தவுடன் ஆறவைத்து எடுக்கவும்.";
    }

    // Current & electricity questions
    if (lowerText.includes('current') || lowerText.includes('கரண்ட்') || lowerText.includes('மின்சாரம்')) {
      if (lowerText.includes('no ') || lowerText.includes('without') || lowerText.includes('இல்ல') || lowerText.includes('போனா')) {
        return "<b>கரண்ட் (மின்சாரம்) இல்லையென்றால் என்ன ஆகும்?</b><br><br>" +
               "• மின் ஓட்டம் இல்லாததால் விளக்குகள், மோட்டார்கள், சென்சார்கள் மற்றும் மைக்ரோகண்ட்ரோலர்கள் உடனே நின்றுவிடும்.<br>" +
               "• தற்காலிகமாக இயங்கும் சிக்னல்கள் நிற்கும்; ஆனால் நிரந்தர மெமரி / சேமிப்பு பாதுகாப்பாக இருக்கும்.";
      }
      return "<b>கரண்ட் (Electric Current) எப்படி வேலை செய்கிறது?</b><br><br>" +
             "• வோல்டேஜ் அழுத்தத்தால் மூடிய சர்க்யூட்டில் எலக்ட்ரான்கள் பாய்வதுதான் கரண்ட் ஆகும்.<br>" +
             "• மூலத்திலிருந்து புறப்பட்டு காம்போனென்ட்களை இயக்கி மீண்டும் எதிர் முனைக்குச் செல்லும்போது மின்சுற்று முழுமையடையும்.";
    }

    // Electronics components & robotics
    if (lowerText.includes('servo') || lowerText.includes('motor') || lowerText.includes('sensor') || lowerText.includes('arduino') || lowerText.includes('capacitor') || lowerText.includes('resistor') || lowerText.includes('led')) {
      return "<b>எலக்ட்ரானிக்ஸ் &amp; ரோபோடிக்ஸ் விளக்கம்</b><br><br>" +
             "• <b>கேள்வி:</b> \"" + q + "\"<br>" +
             "• இந்தப் பாகம் அல்லது அமைப்பு சரியாக இயங்க <b>சரியான வோல்டேஜ் (Voltage)</b>, <b>பொதுவான GND</b> மற்றும் <b>சரியான பின்/சிக்னல் இணைப்பு</b> அவசியம்.<br>" +
             "• உள்ளீடு (Sensor/Signal) -> செயலாக்கம் (Controller/Driver) -> வெளியீடு (Motor/LED) என்ற வரிசையில் இது செயல்படும்.";
    }

    // Universal smart handler for ANY other question
    const cleanedWords = q.replace(/[?!.,]/g, '').trim();

    if (lowerText.startsWith('how') || lowerText.includes('எப்படி')) {
      return "<b>செய்முறை விளக்கம்</b><br><br>" +
             "• <b>கேள்வி:</b> \"" + q + "\"<br>" +
             "• <b>படி 1:</b> " + cleanedWords + " என்பதற்குத் தேவையான அடிப்படைப் பொருட்கள், கருவிகள் அல்லது விதிகளைத் தயார் செய்ய வேண்டும்.<br>" +
             "• <b>படி 2:</b> ஒவ்வொரு படியையும் சரியான வரிசையில் பின்பற்றி, தேவையான அளவு/அமைப்பைச் சரிபார்த்துச் செயல்படுத்த வேண்டும்.";
    }

    if (lowerText.startsWith('why') || lowerText.includes('ஏன்')) {
      return "<b>காரண விளக்கம்</b><br><br>" +
             "• <b>கேள்வி:</b> \"" + q + "\"<br>" +
             "• \"" + cleanedWords + "\" என்பதற்கான முக்கியக் காரணம் அந்தச் சூழல், இயற்பியல் விதி அல்லது செயல்பாட்டில் ஏற்படும் மாற்றமே ஆகும்.<br>" +
             "• அடிப்படைக் காரணத்தைக் கண்டறிந்து சரிசெய்தால் சரியான முடிவைப் பெற முடியும்.";
    }

    if (lowerText.startsWith('what') || lowerText.includes('என்ன')) {
      return "<b>விளக்கம்</b><br><br>" +
             "• <b>கேள்வி:</b> \"" + q + "\"<br>" +
             "• \"" + cleanedWords + "\" என்பது அதன் செயல்பாடு, தன்மை மற்றும் பயன்பாட்டால் அறியப்படுகிறது.<br>" +
             "• இது எங்கு, எதற்காகப் பயன்படுகிறது என்பதைப் புரிந்துகொள்வது முக்கியம்.";
    }

    return "<b>Aaraa AI பதில்</b><br><br>" +
           "• <b>கேள்வி:</b> \"" + q + "\"<br>" +
           "• நீங்கள் கேட்ட \"" + cleanedWords + "\" என்ற கேள்விக்கு, அதன் அடிப்படைத் தத்துவம், தேவையான படிகள் மற்றும் நடைமுறைப் பயன்பாடு ஆகியவற்றைச் சரியாகப் பின்பற்றுவதே முக்கியத் தீர்வாகும்.";
  }

  function runAaraAI() {
    const inputEl = document.getElementById('questionField');
    const rawText = inputEl.value.trim();
    const lowerText = rawText.toLowerCase();

    if (!rawText) {
      alert("தயவுசெய்து ஒரு கேள்வியை டைப் செய்யவும் அல்லது பேசவும்.");
      return;
    }

    const card = document.getElementById('answerCard');
    const titleEl = document.getElementById('answerTitle');
    const contentEl = document.getElementById('answerContent');

    card.style.display = 'block';
    titleEl.innerHTML = '🤖 Aaraa AI Solution';
    contentEl.innerHTML = buildAnswerForAnyQuestion(rawText, lowerText);
  }

  const speechBtn = document.getElementById('speechTrigger');
  const qField = document.getElementById('questionField');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRec) {
    const rec = new SpeechRec();
    rec.lang = 'en-US';

    speechBtn.addEventListener('click', () => {
      speechBtn.classList.add('active');
      qField.placeholder = 'பேசவும்... கேட்டுக் கொண்டிருக்கிறேன்...';
      rec.start();
    });

    rec.onresult = (e) => {
      qField.value = e.results[0][0].transcript;
      speechBtn.classList.remove('active');
      qField.placeholder = 'உங்கள் கேள்வியை இங்கே டைப் செய்யவும்...';
      runAaraAI();
    };

    rec.onerror = () => {
      speechBtn.classList.remove('active');
      qField.placeholder = 'உங்கள் கேள்வியை இங்கே டைப் செய்யவும்...';
    };

    rec.onend = () => {
      speechBtn.classList.remove('active');
    };
  } else {
    speechBtn.style.display = 'none';
  }
</script>

</body>
</html>
