<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaraa AI Assistant - Aaraa Electro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #dff1ff 0%, #f4faff 55%, #e3f2fd 100%);
    color: #0b2545;
    position: relative;
    overflow-x: hidden;
  }

  .wave-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(28px);
    opacity: 0.35;
    animation: floatOrb 10s ease-in-out infinite alternate;
  }

  .orb-1 { width: 240px; height: 240px; background: #38bdf8; top: 8%; left: 6%; }
  .orb-2 { width: 300px; height: 300px; background: #2563eb; bottom: 10%; right: 8%; animation-delay: -4s; }
  .orb-3 { width: 180px; height: 180px; background: #0ea5e9; top: 48%; left: 52%; animation-delay: -7s; }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(35px, -25px) scale(1.12); }
  }

  .header-bar {
    position: relative;
    z-index: 2;
    background: linear-gradient(90deg, #0b3fbf, #0099e6);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 14px rgba(11, 63, 191, 0.18);
  }

  .header-bar h2 { font-size: 21px; letter-spacing: 0.3px; }

  .back-link {
    color: #fff;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.2);
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.2s ease;
  }
  .back-link:hover { background: rgba(255, 255, 255, 0.32); }

  .hero-banner {
    position: relative;
    z-index: 2;
    background: linear-gradient(135deg, #0b3fbf, #00b4f0);
    color: #fff;
    text-align: center;
    padding: 34px 20px;
  }

  .hero-banner h1 {
    font-size: clamp(26px, 4vw, 36px);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .bot-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    animation: gentlePulse 2.4s infinite ease-in-out;
  }

  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .hero-banner p { margin-top: 8px; font-size: 15px; color: #e6f7ff; }

  .main-wrap {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 28px auto 70px;
    padding: 0 18px;
  }

  .panel {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    border: 1px solid #cce3ff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 28px rgba(11, 63, 191, 0.1);
  }

  .panel-title { font-size: 20px; color: #0b3fbf; margin-bottom: 6px; }
  .panel-sub { font-size: 14px; color: #486581; margin-bottom: 18px; }

  .prompt-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .input-shell {
    flex: 1;
    min-width: 240px;
    display: flex;
    align-items: center;
    background: #f8fbff;
    border: 2px solid #38bdf8;
    border-radius: 999px;
    padding: 4px 12px 4px 16px;
  }

  .prompt-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 11px 8px;
    font-size: 15px;
    color: #0b2545;
    outline: none;
  }

  .voice-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #93c5fd;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .voice-btn:hover { background: #1d4ed8; color: #fff; }
  .voice-btn.active { background: #dc2626; border-color: #dc2626; color: #fff; }

  .send-btn {
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #0b3fbf, #0099e6);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 24px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(11, 63, 191, 0.22);
    transition: transform 0.15s ease;
  }
  .send-btn:hover { transform: translateY(-1px); }
  .send-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .quick-bar { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }

  .quick-tag {
    background: #edf6ff;
    border: 1px solid #bfdbfe;
    color: #0b3fbf;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .quick-tag:hover { background: #0b3fbf; color: #fff; }

  .answer-box {
    margin-top: 22px;
    background: #f0f8ff;
    border-left: 5px solid #0b3fbf;
    border-radius: 12px;
    padding: 18px 20px;
    display: none;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-header { font-size: 17px; font-weight: 700; color: #0b3fbf; margin-bottom: 8px; }

  .answer-body {
    font-size: 15px;
    line-height: 1.7;
    color: #1e3a5f;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .left-nav-arrow {
    position: fixed;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #0b5be0;
    color: #fff;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="wave-bg">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>
</div>

<header class="header-bar">
  <h2>Aaraa Electro</h2>
  <a class="back-link" href="project1-page3.html">&larr; Back to Circuit</a>
</header>

<section class="hero-banner">
  <h1><span class="bot-badge">🤖</span> Aaraa AI Assistant</h1>
  <p>Created by ஆரா அமுதன் | எலக்ட்ரானிக்ஸ் கேள்விகளுக்கு எளிய பதில்</p>
</section>

<main class="main-wrap">
  <div class="panel">
    <h3 class="panel-title">💬 Aaraa Smart AI Hub</h3>
    <p class="panel-sub">எலக்ட்ரானிக்ஸ் மற்றும் Arduino சந்தேகங்களைக் கேளுங்கள் — தமிழிலோ ஆங்கிலத்திலோ கேட்கலாம்.</p>

    <div class="prompt-row">
      <div class="input-shell">
        <span>🤖</span>
        <input id="questionField" class="prompt-input" type="text" maxlength="500" placeholder="உங்கள் எலக்ட்ரானிக்ஸ் கேள்வியை இங்கே டைப் செய்யவும்..." onkeydown="if(event.key==='Enter') runAaraAI()">
        <button id="speechTrigger" class="voice-btn" type="button" title="பேசி கேள்வி கேட்க">🎤</button>
      </div>
      <button id="askBtn" class="send-btn" type="button" onclick="runAaraAI()">Ask AI</button>
    </div>

    <div class="quick-bar">
      <button class="quick-tag" type="button" onclick="askPreset('Who are you?')">Who are you?</button>
      <button class="quick-tag" type="button" onclick="askPreset('How does current work?')">How current works</button>
      <button class="quick-tag" type="button" onclick="askPreset('What is a servo motor?')">What is a servo motor</button>
      <button class="quick-tag" type="button" onclick="askPreset('What is an Arduino Nano?')">What is an Arduino Nano</button>
    </div>

    <div id="answerCard" class="answer-box">
      <div id="answerTitle" class="answer-header">🤖 Aaraa AI Solution</div>
      <div id="answerContent" class="answer-body"></div>
    </div>
  </div>
</main>

<a class="left-nav-arrow" href="project1-page3.html" title="Back to Circuit">&#10094;</a>

<script>
  // Your Cloudflare Worker address (the AI key stays hidden inside the Worker)
  const WORKER_URL = 'https://wild-scene-dde1aaraa.maaraamuthan.workers.dev/';

  function askPreset(text) {
    document.getElementById('questionField').value = text;
    runAaraAI();
  }

  // Safely show the AI text: escape HTML, then turn **bold** into <b>bold</b>
  function formatAnswer(text) {
    const escaped = String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    return escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }

  async function runAaraAI() {
    const inputEl = document.getElementById('questionField');
    const askBtn = document.getElementById('askBtn');
    const question = inputEl.value.trim();

    if (!question) {
      alert('தயவுசெய்து ஒரு கேள்வியை டைப் செய்யவும் அல்லது பேசவும்.');
      return;
    }

    const card = document.getElementById('answerCard');
    const titleEl = document.getElementById('answerTitle');
    const contentEl = document.getElementById('answerContent');

    card.style.display = 'block';
    titleEl.textContent = '🤖 Aaraa AI Solution';
    contentEl.textContent = '⏳ யோசிக்கிறேன்... (Thinking...)';
    askBtn.disabled = true;

    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question })
      });

      if (!response.ok) {
        throw new Error('Server error ' + response.status);
      }

      const data = await response.json();
      contentEl.innerHTML = formatAnswer(data.answer || 'Sorry, no answer came back. Please try again.');
    } catch (err) {
      contentEl.textContent = 'மன்னிக்கவும், இப்போது பதில் கிடைக்கவில்லை. இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும். (Sorry, could not get an answer. Please check your internet and try again.)';
    } finally {
      askBtn.disabled = false;
    }
  }

  const speechBtn = document.getElementById('speechTrigger');
  const qField = document.getElementById('questionField');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const defaultPlaceholder = qField.placeholder;

  if (SpeechRec) {
    const rec = new SpeechRec();
    rec.lang = 'en-US';

    speechBtn.addEventListener('click', () => {
      speechBtn.classList.add('active');
      qField.placeholder = 'பேசவும்... கேட்டுக் கொண்டிருக்கிறேன்...';
      rec.start();
    });

    rec.onresult = (e) => {
      qField.value = e.results[0][0].transcript;
      speechBtn.classList.remove('active');
      qField.placeholder = defaultPlaceholder;
      runAaraAI();
    };

    rec.onerror = () => {
      speechBtn.classList.remove('active');
      qField.placeholder = defaultPlaceholder;
    };

    rec.onend = () => {
      speechBtn.classList.remove('active');
    };
  } else {
    speechBtn.style.display = 'none';
  }
</script>

</body>
</html>
