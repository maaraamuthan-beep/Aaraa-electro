<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Aara Electro</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #89cff0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #fff;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  /* Moving Background Components Animation Canvas */
  .bg-animation {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
  }

  .floating-icon {
    position: absolute;
    left: 105%;
    stroke: #ffffff;
    fill: none;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.65;
    filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.25));
    animation: moveAcrossFullScreen linear infinite;
  }

  @keyframes moveAcrossFullScreen {
    0% {
      left: 105%;
      transform: rotate(0deg);
    }
    100% {
      left: -220px;
      transform: rotate(360deg);
    }
  }

  /* Foreground Content */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: clamp(36px, 6vw, 64px);
    margin-bottom: 10px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-weight: 900;
  }
  p {
    font-size: 18px;
    margin-bottom: 30px;
    font-weight: 500;
  }
  .next-btn {
    background: #fff;
    color: #075de8;
    padding: 14px 45px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    transition: all 0.3s ease;
    display: inline-block;
  }
  .next-btn:hover {
    background: #f0f8ff;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
  }
  .next-btn:active {
    transform: translateY(1px) scale(0.98);
  }
</style>
</head>
