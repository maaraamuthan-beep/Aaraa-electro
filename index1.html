<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Projects - Aaraa Electro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #eaf4ff; color: #0b2a5b; min-height: 100vh; }
  .topbar { background: linear-gradient(90deg, #0b3fbf, #00b4f0); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar a { color: #fff; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; }
  .topbar h2 { font-size: 22px; }
  
  .search-container { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
  .search-container h1 { margin-bottom: 20px; color: #0b3fbf; font-size: 32px; }
  
  .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
  .search-box input { flex: 1; padding: 14px 20px; font-size: 16px; border: 2px solid #bce0ff; border-radius: 30px; outline: none; transition: 0.2s; background: #fff; }
  .search-box input:focus { border-color: #0b5be0; box-shadow: 0 0 10px rgba(11,91,224,0.2); }
  
  .results-section { text-align: left; }
  .results-section h3 { margin-bottom: 15px; color: #4a78b8; font-size: 18px; }
  
  .project-card { background: #fff; border-radius: 16px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 18px rgba(11,63,191,0.12); text-decoration: none; color: inherit; transition: 0.2s; border: 2px solid transparent; }
  .project-card:hover { transform: translateY(-3px); border-color: #0b5be0; box-shadow: 0 10px 24px rgba(11,63,191,0.2); }
  
  .project-info h2 { color: #0b3fbf; font-size: 20px; margin-bottom: 6px; }
  .project-info p { color: #555; font-size: 15px; }
  .arrow-icon { font-size: 24px; color: #0b5be0; font-weight: bold; }
</style>
</head>
<body>

<div class="topbar">
  <h2>Aaraa Electro</h2>
  <a href="index.html">&larr; Home</a>
</div>

<div class="search-container">
  <h1>Search Electronics Projects</h1>
  
  <!-- Search Bar -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search for projects (e.g., Line Following Robot)..." onkeyup="filterProjects()">
  </div>

  <div class="results-section">
    <h3>Project Results</h3>
    
    <!-- Line Following Robot Result Card (Links to project1.html) -->
    <div id="projectList">
      <a href="project1.html" class="project-card">
        <div class="project-info">
          <h2>Arduino Line Following Robot</h2>
          <p>Build a smart robot that follows a black line using IR sensors, Arduino, and L298N driver.</p>
        </div>
        <div class="arrow-icon">&#10095;</div>
      </a>
    </div>

  </div>
</div>

<script>
// Simple live search filter function
function filterProjects() {
  let input = document.getElementById('searchInput').value.toLowerCase();
  let card = document.querySelector('.project-card');
  let title = card.querySelector('h2').textContent.toLowerCase();
  let desc = card.querySelector('p').textContent.toLowerCase();
  
  if (title.includes(input) || desc.includes(input)) {
    card.style.display = "flex";
  } else {
    card.style.display = "none";
  }
}
</script>

</body>
</html>
