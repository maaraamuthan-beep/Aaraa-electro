<html>

    background-color: #cce7ff;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: sans-serif;
  }
  .shape {

    height: 80px;

  }
  h1 {
    color: #d92662;
    font-size: 3rem;
    font-weight: bold;
    z-index: 1;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="shape" style="top: 15%; left: 10%;"></div>
  <div class="shape" style="top: 70%; left: 15%; width: 120px; height: 90px;"></div>
  <div class="shape" style="top: 20%; left: 80%; width: 90px; height: 110px;"></div>
  <div class="shape" style="top: 65%; left: 75%; width: 110px; height: 100px;"></div>
  <h1>Welcome to Aaraa Electro</h1>

</html>
